# The public website (albatrossvpn.online): static pages served by a Worker.
# Deployed by .github/workflows/deploy-backend.yml next to the account service.
name = "albatross-site"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false
# Custom domains: Cloudflare creates the DNS records and certificates itself
# (the deploy token has no zone "Workers Routes" right, so no route patterns).
routes = [
  { pattern = "albatrossvpn.online", custom_domain = true },
  { pattern = "www.albatrossvpn.online", custom_domain = true },
]

[assets]
directory = "./public"
not_found_handling = "404-page"
