name: Collect servers

# Gathers every source outside the filtered network and publishes one
# deduplicated list on the "servers" branch, which the apps download
# instead of hundreds of sources (see cmd/collect).
on:
  schedule:
    # Every 5 minutes. A run takes longer than that, so the "due" job lets a
    # scheduled run through only when no other run is collecting: the list
    # is rebuilt back to back, as fresh as a full collection can be.
    # GitHub may still delay or drop some of these; the next one fills in.
    - cron: "*/5 * * * *"
  # A change to the collector or its lists publishes at once instead of
  # waiting for the schedule, which GitHub may also delay or skip.
  push:
    branches: [main]
    paths: ["cmd/collect/**", "internal/sources/**", ".github/workflows/collect.yml"]
  workflow_dispatch:

permissions:
  contents: write

# One collection at a time; a newer one waits instead of overlapping.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: servers
          path: prev
      # wrangler reads users' reports from the project's own storage and
      # puts the files back there (deploy/files/lib.sh).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Users' reports
        # What users' apps found works on their networks (crowd.json,
        # written hourly by the account service): confirmed servers go
        # first in hot.txt, failing ones are left out.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: backend
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler r2 object get albatross-files/list/servers/crowd.json --file "$RUNNER_TEMP/crowd.json" --remote || echo "::warning::no crowd.json yet"
            npx wrangler r2 object get albatross-files/list/servers/iran.json --file "$RUNNER_TEMP/iran.json" --remote || echo "::warning::no report from a tester inside the country yet (deploy/tester)"
            # Sources found by the weekly discovery (discover.yml).
            for f in sources.txt channels.txt; do
              npx wrangler r2 object get "albatross-files/list/servers/$f" --file "$RUNNER_TEMP/$f" --remote || echo "::warning::no discovered $f yet"
            done
          fi
      - name: Cores
        env:
          SINGBOX_VERSION: "1.14.4"
          XRAY_VERSION: "26.10.21"
        run: |
          mkdir -p /tmp/cores && cd /tmp/cores
          curl -fsSL --retry 4 -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar xzf sb.tgz --strip-components=1
          curl -fsSL --retry 4 -o x.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -o x.zip xray
      - name: Collect
        env:
          # Servers in fresh.txt are connected through for real (cmd/collect/realtest.go).
          SING_BOX: /tmp/cores/sing-box
          XRAY: /tmp/cores/xray
          OWN_SERVERS: ${{ secrets.OWN_SERVERS }}
          OWN_KEY: ${{ secrets.OWN_KEY }}
          # Raises globalping's quota for the check from inside Iran.
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
          # Tags of the project's own probes inside the country (dashboard), comma separated.
          GLOBALPING_TAGS: ${{ vars.GLOBALPING_TAGS }}
        # 5,000 real tests keep a run near ten minutes.
        run: |
          go run ./cmd/collect -prev prev -real 5000 -crowd "$RUNNER_TEMP/crowd.json,$RUNNER_TEMP/iran.json" \
            -sources "$RUNNER_TEMP/sources.txt" -channels "$RUNNER_TEMP/channels.txt" -out "$RUNNER_TEMP/servers"
          # The discovered lists travel with the servers branch too.
          for f in sources.txt channels.txt; do [ -f "$RUNNER_TEMP/$f" ] && cp "$RUNNER_TEMP/$f" "$RUNNER_TEMP/servers/$f"; done; true
      # The collector itself, for a tester inside the country (deploy/tester).
      - name: Build the collector for the tester
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -buildvcs=false -ldflags "-s -w" -o "$RUNNER_TEMP/tools/collect-linux-$arch" ./cmd/collect
          done
          cp deploy/tester/install.sh "$RUNNER_TEMP/tools/tester-install.sh"
      - name: Publish
        working-directory: ${{ runner.temp }}/servers
        run: |
          # One commit, replaced each run, so the branch never grows.
          git init -q -b servers
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Servers $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" servers
      - name: Publish to the project's own storage
        # The apps read the lists from there first (sources.Addresses), so
        # they keep working once the repository is private.
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          account="$(bash build/account-url.sh | cut -d, -f1)"
          files=()
          for f in hot.txt new.txt fresh.txt all-1.txt all-2.txt all-3.txt all-4.txt all-5.txt all-6.txt all-7.txt all-8.txt tor.json meta.json; do
            [ -f "$RUNNER_TEMP/servers/$f" ] && files+=("$RUNNER_TEMP/servers/$f")
          done
          bash deploy/files/publish-lists.sh "$account" servers "${files[@]}"
          bash deploy/files/publish-lists.sh "$account" tools "$RUNNER_TEMP"/tools/collect-linux-*
