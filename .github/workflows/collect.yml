name: Collect servers

# Gathers every source outside the filtered network and publishes one
# deduplicated list on the "servers" branch, which the apps download
# instead of hundreds of sources (see cmd/collect).
on:
  schedule:
    # Every 5 minutes. A run takes longer than that, so the "due" job lets a
    # scheduled run through only when no other run is collecting: the list
    # is rebuilt back to back, as fresh as a full collection can be.
    # GitHub may still delay or drop some of these; the next one fills in.
    - cron: "*/5 * * * *"
  # A change to the collector or its lists publishes at once instead of
  # waiting for the schedule, which GitHub may also delay or skip.
  push:
    branches: [main]
    paths: ["cmd/collect/**", "internal/sources/**", ".github/workflows/collect.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  due:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      - id: age
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs are not queued behind each other (a queue keeps only the
          # newest and cancels the rest): a run stops when an older one is
          # still going, so two starting together never both stop.
          busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/collect.yml/runs?status=in_progress" \
            --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID)] | length")
          if [ "$busy" -gt 0 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
  collect:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: servers
          path: prev
      - name: Cores
        env:
          SINGBOX_VERSION: "1.14.4"
          XRAY_VERSION: "26.10.21"
        run: |
          mkdir -p /tmp/cores && cd /tmp/cores
          curl -fsSL --retry 4 -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar xzf sb.tgz --strip-components=1
          curl -fsSL --retry 4 -o x.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -o x.zip xray
      - name: Collect
        env:
          # Servers in fresh.txt are connected through for real (cmd/collect/realtest.go).
          SING_BOX: /tmp/cores/sing-box
          XRAY: /tmp/cores/xray
          OWN_SERVERS: ${{ secrets.OWN_SERVERS }}
          OWN_KEY: ${{ secrets.OWN_KEY }}
        run: go run ./cmd/collect -prev prev -out "$RUNNER_TEMP/servers"
      - name: Publish
        working-directory: ${{ runner.temp }}/servers
        run: |
          # One commit, replaced each run, so the branch never grows.
          git init -q -b servers
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Servers $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" servers
