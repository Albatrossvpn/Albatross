name: Deploy accounts and website

# Publishes backend/ (the account service) and site/ (the public website at
# albatrossvpn.online) to Cloudflare. Run it by hand from the Actions tab
# after setting the secrets and variables listed in backend/README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Check the settings
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TOKEN_SECRET ADMIN_USER ADMIN_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::The secret $v is not set (see backend/README.md)"; exit 1; }
          done
          [ ${#TOKEN_SECRET} -ge 32 ] || { echo "::error::TOKEN_SECRET must have at least 32 characters"; exit 1; }
        env:
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      - name: Find or create the database
        run: |
          id="$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="albatross");if(d)console.log(d.uuid)})')"
          if [ -z "$id" ]; then
            npx wrangler d1 create albatross
            id="$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).find(x=>x.name==="albatross").uuid))')"
          fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Update the database
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        env:
          DOMAIN: ${{ vars.SITE_DOMAIN }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          COMPANY_NAME: ${{ vars.COMPANY_NAME }}
          COMPANY_ADDRESS: ${{ vars.COMPANY_ADDRESS }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          args=()
          [ -n "$DOMAIN" ] && args+=(--domain "$DOMAIN")
          [ -n "$SITE_NAME" ] && args+=(--var "SITE_NAME:$SITE_NAME")
          args+=(--var "COMPANY_NAME:$COMPANY_NAME" --var "COMPANY_ADDRESS:$COMPANY_ADDRESS" --var "CONTACT_EMAIL:$CONTACT_EMAIL")
          npx wrangler deploy "${args[@]}"
      - name: Check Encrypted Client Hello
        # ECH hides the service's name in the TLS handshake; the app reads the
        # key from the HTTPS DNS record (internal/engine/ech.go). Cloudflare
        # turns it on by default on free zones; this turns it on otherwise,
        # if the token may change zone settings.
        continue-on-error: true
        run: |
          rc=0
          for host in $(sed -n 's/.*pattern *= *"\([^"]*\)", *custom_domain *= *true.*/\1/p' wrangler.toml); do
            if curl -fsS "https://dns.google/resolve?name=$host&type=HTTPS" | jq -e '[.Answer[]?.data | select(test("ech="))] | length > 0' >/dev/null; then
              echo "ECH is on for $host."; continue
            fi
            zone="${host#*.}"
            api="https://api.cloudflare.com/client/v4/zones"
            id="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?name=$zone" | jq -r '.result[0].id // empty')"
            [ -n "$id" ] || { echo "::warning::The API token cannot see the zone $zone, so ECH was not checked."; rc=1; continue; }
            out="$(curl -sS -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"value":"on"}' "$api/$id/settings/ech")"
            echo "$out" | jq -c '{success, errors: [.errors[]?.message], value: .result.value}'
            [ "$(echo "$out" | jq -r .success)" = true ] || { echo "::warning::ECH could not be turned on: the API token needs the Zone Settings Edit permission for $zone."; rc=1; }
          done
          exit $rc
      - name: Set the secrets
        env:
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          for v in TOKEN_SECRET ADMIN_USER ADMIN_PASSWORD; do
            printf '%s' "${!v}" | npx wrangler secret put "$v"
          done

  site:
    # The public website: static pages on the zone's bare domain and www.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Clear hand-made records on the website's names
        # A Worker custom domain cannot be created while the name has an
        # ordinary A/AAAA/CNAME record (error 100117), so such records are
        # removed first. Records Cloudflare manages itself are left alone.
        run: |
          api="https://api.cloudflare.com/client/v4"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zone="$(curl -sS -H "$auth" "$api/zones?name=albatrossvpn.online" | jq -r '.result[0].id // empty')"
          if [ -z "$zone" ]; then echo "::warning::The token cannot read the zone; delete the A/CNAME records of albatrossvpn.online and www by hand if the deploy fails."; exit 0; fi
          for host in albatrossvpn.online www.albatrossvpn.online; do
            curl -sS -H "$auth" "$api/zones/$zone/dns_records?name=$host&per_page=100" \
              | jq -r '.result[] | select((.type=="A" or .type=="AAAA" or .type=="CNAME") and ((.meta.read_only // false) | not)) | .id + " " + .type + " " + .content' \
              | while read -r id type content; do
                  echo "removing $type $host -> $content"
                  curl -sS -o /dev/null -w "  delete: %{http_code}\n" -X DELETE -H "$auth" "$api/zones/$zone/dns_records/$id" || true
                done
          done
      - name: Deploy the website
        run: npx wrangler deploy --config ../site/wrangler.toml
