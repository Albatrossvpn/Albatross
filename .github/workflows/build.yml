name: Build

on:
  # Branches are built through their pull requests; one run per change.
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore: ["update.json"]
  pull_request:
  # No nightly run: a private repository has 2,000 free Actions minutes a
  # month, and a full build takes about half an hour of them.
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version (e.g. 0.2.0); the run creates the v<version> tag"
        required: false
      force_update:
        description: "Older versions stop connecting until updated"
        type: boolean
        default: true
      update_message:
        description: "Shown with the update in installed copies (English)"
        required: false

permissions:
  contents: write

# A newer push to the same pull request or branch makes the older run moot.
# A release has a group of its own: a push or the nightly run on main would
# otherwise cancel it while it waits.
concurrency:
  group: ${{ inputs.release != '' && format('release-{0}', inputs.release) || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SINGBOX_VERSION: "1.14.4"
  XRAY_VERSION: "26.10.21"
  WARPPLUS_VERSION: "1.2.6"
  USQUE_VERSION: "4.2.1"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: sing-box loads the subscription's config
        # The sing-box apps on Apple devices load the subscription as a whole
        # config, and one outbound sing-box refuses stops every server: a
        # config of every kind of link the subscriptions carry is checked by
        # sing-box itself, at the version the app ships.
        run: |
          v="$(sed -n 's/^SINGBOX_VERSION="\${SINGBOX_VERSION:-\([0-9.]*\)}"$/\1/p' ../build/package.sh)"
          curl -fsSL --retry 4 -o /tmp/sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v$v/sing-box-$v-linux-amd64.tar.gz"
          tar xzf /tmp/sb.tgz -C /tmp --strip-components=1
          node test/singbox-config.mjs > /tmp/sub.json
          /tmp/sing-box check -c /tmp/sub.json
      - name: API tests (a local Worker with a local database)
        run: npm run test:api
      - name: Edge Worker unit tests
        # The edge has no package of its own; its tests were never run.
        run: node --test ../edge/test/*.test.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Build-time variables exist
        # -X skips a name that moved without a word: a release would then
        # connect without an account or the project's own servers.
        run: |
          mod="$(go list -m)"
          for x in $(grep -ho -- '-X [^ ="]*' build/package.sh build/android/build.sh | cut -c4- | sort -u); do
            case "$x" in
              main.*) x="$mod/cmd/albatross.${x#main.}" ;; # package.sh builds ./cmd/albatross
              "$mod"/*) ;;
              *) continue ;; # another module's (the cores')
            esac
            go doc -u "$x" | grep -q '^var ' || { echo "::error::$x, set with -X by the build scripts, is not a variable any more."; exit 1; }
            echo "found $x"
          done
      - name: The page runs on old WebViews
        # Android 6's WebView is Chrome 44: one newer piece of syntax and the
        # page stays blank. old-webview.js tells such users what to update,
        # so it must run on anything. The page's policy blocks inline scripts.
        run: |
          npx --yes acorn@8.19.0 --ecma5 --silent internal/ui/web/app.js
          npx --yes acorn@8.19.0 --ecma3 --silent internal/ui/web/old-webview.js
          ! grep -nE '<script>|\son[a-z]+=' internal/ui/web/index.html || { echo "::error::index.html has an inline script or event handler."; exit 1; }
      - name: Collector smoke test
        run: go run ./cmd/collect -limit 6 -probe=false -out /tmp/collect && cat /tmp/collect/meta.json
      - name: Download cores for end-to-end tests
        run: |
          mkdir -p /tmp/cores && cd /tmp/cores
          curl -fsSL --retry 4 -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar xzf sb.tgz --strip-components=1
          curl -fsSL --retry 4 -o x.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -o x.zip xray
          bash "$GITHUB_WORKSPACE/build/tor.sh" linux-x86_64 /tmp/cores/torbundle
      - name: Helpers for the login test
        # The sidecar helpers at the versions the apps ship, so a test can
        # check that each one's SOCKS5 port takes only the run's login.
        run: |
          eval "$(grep -E '^(NAIVE|JUICITY|MIERU|WSTUNNEL|MIHOMO)_VERSION=|^WIREPROXY_AWG_REF=' build/package.sh)"
          gh=https://github.com
          h=/tmp/helpers && mkdir -p "$h" /tmp/helpers-dl && cd /tmp/helpers-dl
          curl -fsSL --retry 4 -o naive.txz "$gh/klzgrad/naiveproxy/releases/download/$NAIVE_VERSION/naiveproxy-$NAIVE_VERSION-linux-x64.tar.xz"
          tar -xJf naive.txz && cp "$(find . -type f -name naive | head -1)" "$h/naive"
          curl -fsSL --retry 4 -o juicity.zip "$gh/juicity/juicity/releases/download/v$JUICITY_VERSION/juicity-linux-x86_64.zip"
          unzip -qo juicity.zip juicity-client -d "$h"
          curl -fsSL --retry 4 -o mieru.tgz "$gh/enfein/mieru/releases/download/v$MIERU_VERSION/mieru_${MIERU_VERSION}_linux_amd64.tar.gz"
          tar -xzf mieru.tgz && cp "$(find . -type f -name mieru | head -1)" "$h/mieru"
          curl -fsSL --retry 4 -o wst.tgz "$gh/erebe/wstunnel/releases/download/v$WSTUNNEL_VERSION/wstunnel_${WSTUNNEL_VERSION}_linux_amd64.tar.gz"
          tar -xzf wst.tgz wstunnel && cp wstunnel "$h/wstunnel"
          git clone -q --depth 1 --branch "$WIREPROXY_AWG_REF" "$gh/artem-russkikh/wireproxy-awg" wpawg
          (cd wpawg && CGO_ENABLED=0 GOTOOLCHAIN=auto go build -trimpath -buildvcs=false -ldflags "-s -w -checklinkname=0" -o "$h/wireproxy-awg" ./cmd/wireproxy)
          git clone -q --depth 1 --branch "v$MIHOMO_VERSION" "$gh/MetaCubeX/mihomo" mihomo
          (cd mihomo && CGO_ENABLED=0 GOTOOLCHAIN=auto go build -trimpath -buildvcs=false -ldflags "-s -w -checklinkname=0" -o "$h/mihomo" .)
          chmod 755 "$h"/*
          ls -l "$h"
      - name: Test
        env:
          SING_BOX: /tmp/cores/sing-box
          XRAY: /tmp/cores/xray
          TOR_BUNDLE: /tmp/cores/torbundle
          ALBATROSS_HELPERS: /tmp/helpers
          E2E_UPSTREAM: direct
        run: |
          E2E_HOST_IP="$(hostname -I | awk '{print $1}')"
          export E2E_HOST_IP
          set -o pipefail
          # Nightly: is the bundled Iranian address list still complete?
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then export RIPE_CHECK=1; fi
          # One line per package in the run's summary, so a reader needs no log.
          rc=0
          go test -count=1 -timeout 15m ./... 2>&1 | tee /tmp/test.log || rc=$?
          { echo "### Go tests"; grep -E '^(ok|FAIL|---)|RIPE IR' /tmp/test.log | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY" || true
          exit $rc
      - name: Android tunnel path
        # Makes a TUN device the way Android's VpnService does, so it needs root.
        env:
          SING_BOX: /tmp/cores/sing-box
          XRAY: /tmp/cores/xray
          E2E_UPSTREAM: direct
        run: |
          E2E_HOST_IP="$(hostname -I | awk '{print $1}')"
          export E2E_HOST_IP
          go test -c -o /tmp/mobile.test ./mobile
          sudo --preserve-env=SING_BOX,XRAY,E2E_UPSTREAM,E2E_HOST_IP /tmp/mobile.test -test.count=1 -test.v -test.run AndroidPath

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$RELEASE" ]; then v="$RELEASE"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.1.0-dev.${GITHUB_RUN_NUMBER}"; fi
          # A release named otherwise ("v0.3.4", "0.3") would still be
          # published and marked latest, and installed copies cannot
          # compare it.
          if { [ -n "$RELEASE" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; } && ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A release version must be three numbers like 0.3.4, with no v or spaces."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The collector's lists go out sealed with keys only signed-in apps
      # get; the build opens the newest with them to bundle it in the app
      # (build/snapshot.sh), so a first start has servers before anyone
      # signs in. wrangler is installed in a step of its own, without the
      # credentials; the keys stay on the runner (never in the log or an
      # artifact). A fork's pull request has no credentials and bundles
      # nothing new.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: wrangler, for the list keys
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: List keys for the bundled server list
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "no Cloudflare credentials: the bundled server list stays as it is"
          elif npx wrangler r2 object get albatross-files/private/listkeys.json --file "$RUNNER_TEMP/listkeys.json" --remote > /dev/null; then
            echo "LIST_KEYS=$RUNNER_TEMP/listkeys.json" >> "$GITHUB_ENV"
          else
            echo "::warning::The list keys could not be read: the bundled server list stays as it is."
          fi
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Opens the list of the project's own servers (deploy/server).
          OWN_KEY: ${{ secrets.OWN_KEY }}
          # Signs the update manifest; the build carries its public key.
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          RELEASE: ${{ inputs.release }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          # Mirrors inside the country (deploy/server MIRROR mode), comma separated.
          DOMESTIC_MIRROR: ${{ vars.DOMESTIC_MIRROR }}
        run: |
          # The list keys are of no use to the later steps.
          trap 'rm -f "$RUNNER_TEMP/listkeys.json"' EXIT
          # Releases ask users to sign in (backend/); test builds connect
          # without an account.
          if [ -n "$RELEASE" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Without it a release cannot open the project's own servers
            # (the sealed list stays closed); everything else works, so the
            # release goes on with a warning.
            [ -n "$OWN_KEY" ] || echo "::warning::The OWN_KEY secret is not set: this release cannot open the project's own servers."
            # A release trusts only a signed update manifest, so a forged
            # one (a CDN mirror, a taken-over account) can never make it
            # download or stop anything.
            [ ${#TOKEN_SECRET} -ge 32 ] || { echo "::error::A release needs the TOKEN_SECRET secret (32+ characters) to sign the update manifest."; exit 1; }
            UPDATE_KEY="$(go run ./cmd/signupdate pubkey)"
            ACCOUNT_URL="$(bash build/account-url.sh)"
            MIRROR_URL="$(bash build/mirror-urls.sh)"
            export ACCOUNT_URL MIRROR_URL UPDATE_KEY
          fi
          bash build/package.sh
      # The builds go from one job to the next through the cache, not as
      # artifacts: artifacts count against the account's Actions storage
      # (0.5 GB on the free plan; a run's builds are some 440 MB, and the
      # storage stays full for hours after it was), the cache has a limit of
      # its own. A key per run and attempt (an entry cannot be replaced), and
      # a restore takes the newest attempt's when the job it needs was not
      # run again; the Windows and Linux jobs share an archive.
      - uses: actions/cache/save@v6
        with:
          key: folder-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/Albatross
          enableCrossOsArchive: true

  android:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK and NDK
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null || true
          "$sdk" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      # The server list bundled in the app, as in the build job.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: wrangler, for the list keys
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: List keys for the bundled server list
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "no Cloudflare credentials: the bundled server list stays as it is"
          elif npx wrangler r2 object get albatross-files/private/listkeys.json --file "$RUNNER_TEMP/listkeys.json" --remote > /dev/null; then
            echo "LIST_KEYS=$RUNNER_TEMP/listkeys.json" >> "$GITHUB_ENV"
          else
            echo "::warning::The list keys could not be read: the bundled server list stays as it is."
          fi
      - name: Build APKs
        env:
          OWN_KEY: ${{ secrets.OWN_KEY }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          # Mirrors inside the country (deploy/server MIRROR mode), comma separated.
          DOMESTIC_MIRROR: ${{ vars.DOMESTIC_MIRROR }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALBATROSS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALBATROSS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALBATROSS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE: ${{ inputs.release }}
        run: |
          # The list keys and the signing key are of no use to the later
          # steps, one of which is someone else's action (the emulator).
          trap 'rm -f "$RUNNER_TEMP/listkeys.json" "$RUNNER_TEMP/albatross.jks"' EXIT
          # Without a key in the repository secrets the APKs get the runner's
          # debug key, which is new on every run: Android then refuses to
          # install the next version over the old one. Fine for test builds,
          # never for a release.
          if [ -z "$KEYSTORE_BASE64" ] && { [ -n "$RELEASE" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; }; then
            echo "::error::A release needs the ANDROID_KEYSTORE_BASE64 secret, or users must uninstall to update."
            exit 1
          fi
          # Releases ask users to sign in and trust only a signed update
          # manifest; see the Windows build.
          if [ -n "$RELEASE" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ ${#TOKEN_SECRET} -ge 32 ] || { echo "::error::A release needs the TOKEN_SECRET secret (32+ characters) to sign the update manifest."; exit 1; }
            UPDATE_KEY="$(go run ./cmd/signupdate pubkey)"
            ACCOUNT_URL="$(bash build/account-url.sh)"
            MIRROR_URL="$(bash build/mirror-urls.sh)"
            export ACCOUNT_URL MIRROR_URL UPDATE_KEY
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/albatross.jks"
            export ALBATROSS_KEYSTORE="$RUNNER_TEMP/albatross.jks"
          fi
          bash build/android/build.sh
          apk="$(ls dist/*-android.apk)"
          # A release's sign-in is not tried on the emulators: look for the
          # address in the engine itself (counts only, the address stays out
          # of the log). The linker keeps it once however many -X names
          # carry it, so this only shows that it got in at all; the test
          # job checks that each name still exists.
          if [ -n "$RELEASE" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            for abi in arm64-v8a armeabi-v7a; do
              n="$(unzip -p "$apk" "lib/$abi/libgojni.so" | grep -acF -- "$ACCOUNT_URL" || true)"
              echo "$abi engine: account service address found ${n:-0} times"
              [ "${n:-0}" -gt 0 ] || { echo "::error::The $abi engine has no account service address."; exit 1; }
            done
          fi
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|native-code)"
          # Android 6 knows only the v1 scheme, 7 and 8 v2, 9 and later v3
          # (which also lets a future key replace this one).
          "$tools/apksigner" verify --verbose --min-sdk-version 23 "$apk" | tee "$RUNNER_TEMP/sig.txt"
          want="v1 v2"
          [ -n "$KEYSTORE_BASE64" ] && want="v1 v2 v3"
          for v in $want; do
            grep -q "Verified using $v scheme.*: true" "$RUNNER_TEMP/sig.txt" || { echo "::error::The APK has no $v signature."; exit 1; }
          done
          # Which key signed it: the release key's digest stays the same
          # from one version to the next.
          signer="$("$tools/apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256' | awk '{print $NF}')"
          echo "APK signer SHA-256: $signer"
          echo "- APK signer SHA-256: \`$signer\`, signed with $want, $(du -m "$apk" | cut -f1) MB" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v6
        if: inputs.release != '' || startsWith(github.ref, 'refs/tags/v')
        with:
          key: android-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*.apk
      # The same app, debuggable, connects on an emulator: proves the cores,
      # Tor and the VPN service run on Android, not just that it builds. A
      # release asks for an account, so the commit's own run (without one)
      # is the proof for it.
      - name: Debuggable build for the emulator
        if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
        run: cd android && ABIS=x86_64 ./gradlew --no-daemon -q assembleDebug
      - name: Enable KVM
        if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Connect on an emulator
        if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash build/android/selftest.sh
      # Android 8 to 11 forbid apps some system calls (a forbidden one
      # used to kill the app as soon as it started a core).
      - name: Connect on an Android 11 emulator
        if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash build/android/selftest.sh
      # The oldest Android the app supports.
      - name: Connect on an Android 6 emulator
        if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 23
          arch: x86_64
          target: google_apis
          # Its data partition is too small for the app otherwise.
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash build/android/selftest.sh

  installer:
    needs: build
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          key: folder-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: folder-${{ github.run_id }}-
          path: dist/Albatross
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit tests on Windows
        # The packages whose behaviour differs on Windows (files, renames,
        # paths): the tests run on Linux otherwise, and a compaction of the
        # server pool failed on Windows only, unseen.
        run: go test -count=1 ./internal/pool ./internal/node ./internal/sources ./internal/account ./internal/updatesig ./internal/geo ./internal/platform
      - name: Smoke test on Windows
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "albatross-data"
          $out = Join-Path $env:RUNNER_TEMP "albatross-out.txt"
          $p = Start-Process -FilePath "dist\Albatross\Albatross.exe" -ArgumentList "--headless","--ui-port","18080","--data",$data -RedirectStandardOutput $out -PassThru
          $url = $null
          for ($i = 0; $i -lt 30 -and -not $url; $i++) { Start-Sleep 1; $url = Get-Content $out -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $url) { throw "the app did not start" }
          $token = $url.Split("#")[1]
          $h = @{ "X-Token" = $token }
          $state = Invoke-RestMethod -Uri "http://127.0.0.1:18080/api/state" -Headers $h
          # The page is not told about cores; check the files and that the engine answers.
          foreach ($c in "sing-box", "xray", "warp-plus", "usque") { if (-not (Test-Path "dist\Albatross\core\$c.exe")) { throw "$c is missing" } }
          if (-not (Test-Path "dist\Albatross\core\wintun.dll")) { throw "wintun.dll is missing: the whole-device mode cannot make its tunnel without it" }
          if (-not $state.status) { throw "the engine did not answer" }
          if ($state.PSObject.Properties.Name -contains "cores") { throw "the state still lists cores" }
          $page = Invoke-WebRequest -Uri "http://127.0.0.1:18080/" -UseBasicParsing
          if ($page.StatusCode -ne 200) { throw "UI not served" }
          & dist\Albatross\core\sing-box.exe version
          & dist\Albatross\core\xray.exe version
          Stop-Process -Id $p.Id -Force
      - name: Release asks users to sign in
        if: inputs.release != '' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "albatross-acct"
          $out = Join-Path $env:RUNNER_TEMP "albatross-acct.txt"
          $p = Start-Process -FilePath "dist\Albatross\Albatross.exe" -ArgumentList "--headless","--ui-port","18082","--data",$data -RedirectStandardOutput $out -PassThru
          $url = $null
          for ($i = 0; $i -lt 30 -and -not $url; $i++) { Start-Sleep 1; $url = Get-Content $out -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $h = @{ "X-Token" = $url.Split("#")[1] }
          $s = Invoke-RestMethod -Uri "http://127.0.0.1:18082/api/state" -Headers $h
          Stop-Process -Id $p.Id -Force
          if (-not $s.account.enabled) { throw "this release lets people connect without an account" }
          "sign-in is required"
      - name: Real-world connection test
        if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
        # Public free servers change by the minute; report but never block.
        continue-on-error: true
        timeout-minutes: 12
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "albatross-real"
          $out = Join-Path $env:RUNNER_TEMP "albatross-real.txt"
          $p = Start-Process -FilePath "dist\Albatross\Albatross.exe" -ArgumentList "--headless","--ui-port","18081","--data",$data -RedirectStandardOutput $out -PassThru
          $url = $null
          for ($i = 0; $i -lt 30 -and -not $url; $i++) { Start-Sleep 1; $url = Get-Content $out -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $h = @{ "X-Token" = $url.Split("#")[1] }
          $api = "http://127.0.0.1:18081/api"
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 5
            $s = Invoke-RestMethod -Uri "$api/state" -Headers $h
            "t=$($i*5)s servers=$($s.servers) countries=$(@($s.countries | Where-Object { $_.servers -gt 0 }).Count)"
            if ($s.servers -ge 3) { break }
          }
          Invoke-RestMethod -Method Post -Uri "$api/connect" -Headers $h -ContentType "application/json" -Body '{"country":""}' | Out-Null
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep 3
            $s = Invoke-RestMethod -Uri "$api/state" -Headers $h
            "status=$($s.status) $($s.message)"
            if ($s.status -eq "connected") { break }
          }
          if ($s.status -eq "connected") {
            "connected, exit $($s.conn.country), $($s.conn.delay) ms"
            curl.exe -s -x http://127.0.0.1:10808 https://www.cloudflare.com/cdn-cgi/trace
          }
          $s.countries | Where-Object { $_.servers -gt 0 } | Select-Object -First 20 code, servers, best_delay | Format-Table | Out-String
          Invoke-RestMethod -Method Post -Uri "$api/disconnect" -Headers $h | Out-Null
          Stop-Process -Id $p.Id -Force
          if ($s.status -ne "connected") { throw "did not connect" }
      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "build\windows\MicrosoftEdgeWebview2Setup.exe"
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$pwd\dist\Albatross" "/DOutputDir=$pwd\dist" "build\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist\*.exe
      - name: Test installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Albatross-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "albatross-installed"
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=`"$dir`"" -Wait
          foreach ($f in "Albatross.exe","core\sing-box.exe","core\xray.exe","core\warp-plus.exe","core\usque.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f after install" }
          }
          "installed OK: $dir"
      - uses: actions/cache/save@v6
        if: inputs.release != '' || startsWith(github.ref, 'refs/tags/v')
        with:
          key: setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/Albatross-Setup-*.exe
          enableCrossOsArchive: true

  # Only this job publishes the release, once every build and test passed,
  # so a platform that failed never ships half a release marked latest.
  release-assets:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [backend, test, build, installer, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v6
        with:
          key: android-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: android-${{ github.run_id }}-
          path: dist/*.apk
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        with:
          key: setup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: setup-${{ github.run_id }}-
          path: dist/Albatross-Setup-*.exe
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      # One download per platform: the Windows installer and one Android
      # APK for every phone.
      - name: Name the APK
        run: mv dist/*-android.apk "Albatross-${{ needs.build.outputs.version }}-android.apk"
      - uses: softprops/action-gh-release@v3
        with:
          # The workflow's own token creates the release; a RELEASE_TOKEN
          # secret (a fine-grained token with Contents read and write on
          # this repository) is used instead when the repository's
          # settings keep the workflow token from doing so.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          # 0.3.1 and earlier were signed with a throwaway key; Android
          # installs the first build signed with the release key only after
          # the old app is removed.
          body: |
            Android: one APK for every phone, Android 6 and newer, 64 and 32-bit. If you have 0.3.1 or older, uninstall it before installing this version (one time only). Later updates install over it.
          fail_on_unmatched_files: true
          files: |
            Albatross-*-android.apk
            dist/Albatross-Setup-*.exe
      - uses: actions/checkout@v7
        with:
          ref: main
          path: repo
      - uses: actions/setup-go@v7
        with:
          go-version-file: repo/go.mod
          cache-dependency-path: repo/go.sum
      # wrangler, to put the files straight into the project's own storage
      # (deploy/files/lib.sh).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: repo/backend/package-lock.json
      - run: npm ci
        working-directory: repo/backend
      # Installed copies learn of the new version from update.json, with
      # each platform's installer and SHA-256 so they update in place.
      - name: Tell installed copies
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          VERSION: ${{ needs.build.outputs.version }}
          FORCE: ${{ github.event_name != 'workflow_dispatch' || inputs.force_update }}
          MESSAGE: ${{ inputs.update_message }}
        run: bash repo/build/update-manifest.sh
