name: Build

on:
  # Branches are built through their pull requests; one run per change.
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore: ["update.json"]
  pull_request:
  # Every night, so a broken core, list or Tor change shows up without
  # anyone looking.
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version (e.g. 0.2.0); the run creates the v<version> tag"
        required: false
      force_update:
        description: "Older versions stop connecting until updated"
        type: boolean
        default: true
      update_message:
        description: "Shown with the update in installed copies (English)"
        required: false

permissions:
  contents: write

# A newer push to the same pull request or branch makes the older run moot.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SINGBOX_VERSION: "1.14.3"
  XRAY_VERSION: "26.9.30"
  WARPPLUS_VERSION: "1.2.6"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: API tests (a local Worker with a local database)
        run: npm run test:api

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Collector smoke test
        run: go run ./cmd/collect -limit 6 -probe=false -out /tmp/collect && cat /tmp/collect/meta.json
      - name: Download cores for end-to-end tests
        run: |
          mkdir -p /tmp/cores && cd /tmp/cores
          curl -fsSL --retry 4 -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar xzf sb.tgz --strip-components=1
          curl -fsSL --retry 4 -o x.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -o x.zip xray
          bash "$GITHUB_WORKSPACE/build/tor.sh" linux-x86_64 /tmp/cores/torbundle
      - name: Test
        env:
          SING_BOX: /tmp/cores/sing-box
          XRAY: /tmp/cores/xray
          TOR_BUNDLE: /tmp/cores/torbundle
          E2E_UPSTREAM: direct
        run: |
          export E2E_HOST_IP="$(hostname -I | awk '{print $1}')"
          set -o pipefail
          # Nightly: is the bundled Iranian address list still complete?
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then export RIPE_CHECK=1; fi
          # One line per package in the run's summary, so a reader needs no log.
          rc=0
          go test -count=1 -timeout 15m ./... 2>&1 | tee /tmp/test.log || rc=$?
          { echo "### Go tests"; grep -E '^(ok|FAIL|---)|RIPE IR' /tmp/test.log | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY" || true
          exit $rc
      - name: Android tunnel path
        # Makes a TUN device the way Android's VpnService does, so it needs root.
        env:
          SING_BOX: /tmp/cores/sing-box
          XRAY: /tmp/cores/xray
          E2E_UPSTREAM: direct
        run: |
          export E2E_HOST_IP="$(hostname -I | awk '{print $1}')"
          go test -c -o /tmp/mobile.test ./mobile
          sudo --preserve-env=SING_BOX,XRAY,E2E_UPSTREAM,E2E_HOST_IP /tmp/mobile.test -test.count=1 -test.v -test.run AndroidPath

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then v="$RELEASE"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.1.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Opens the list of the project's own servers (deploy/server).
          OWN_KEY: ${{ secrets.OWN_KEY }}
          RELEASE: ${{ inputs.release }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          # Releases ask users to sign in (backend/); test builds connect
          # without an account.
          if [ -n "$RELEASE" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ACCOUNT_URL="$(bash build/account-url.sh)"
            export ACCOUNT_URL
          fi
          bash build/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Albatross-folder
          path: dist/Albatross
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Albatross-portable-${{ steps.version.outputs.version }}
          path: dist/*.zip

  android:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK and NDK
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null || true
          "$sdk" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: Build APKs
        env:
          OWN_KEY: ${{ secrets.OWN_KEY }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALBATROSS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALBATROSS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALBATROSS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE: ${{ inputs.release }}
        run: |
          # Without a key in the repository secrets the APKs get the runner's
          # debug key, which is new on every run: Android then refuses to
          # install the next version over the old one. Fine for test builds,
          # never for a release.
          if [ -z "$KEYSTORE_BASE64" ] && { [ -n "$RELEASE" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; }; then
            echo "::error::A release needs the ANDROID_KEYSTORE_BASE64 secret, or users must uninstall to update."
            exit 1
          fi
          # Releases ask users to sign in; see the Windows build.
          if [ -n "$RELEASE" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ACCOUNT_URL="$(bash build/account-url.sh)"
            export ACCOUNT_URL
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/albatross.jks"
            export ALBATROSS_KEYSTORE="$RUNNER_TEMP/albatross.jks"
          fi
          bash build/android/build.sh
          apk="$(ls dist/*-android.apk)"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|native-code)"
          # Android 6 knows only the v1 scheme, 7 and 8 v2, 9 and later v3
          # (which also lets a future key replace this one).
          "$tools/apksigner" verify --verbose --min-sdk-version 23 "$apk" | tee "$RUNNER_TEMP/sig.txt"
          want="v1 v2"
          [ -n "$KEYSTORE_BASE64" ] && want="v1 v2 v3"
          for v in $want; do
            grep -q "Verified using $v scheme.*: true" "$RUNNER_TEMP/sig.txt" || { echo "::error::The APK has no $v signature."; exit 1; }
          done
          # Which key signed it: the release key's digest stays the same
          # from one version to the next.
          signer="$("$tools/apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256' | awk '{print $NF}')"
          echo "APK signer SHA-256: $signer"
          echo "- APK signer SHA-256: \`$signer\`, signed with $want, $(du -m "$apk" | cut -f1) MB" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Albatross-android-${{ env.VERSION }}
          path: dist/*.apk
      # The same app, debuggable, connects on an emulator: proves the cores,
      # Tor and the VPN service run on Android, not just that it builds. A
      # release asks for an account, so the commit's own run (without one)
      # is the proof for it.
      - name: Debuggable build for the emulator
        if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
        run: cd android && ABIS=x86_64 ./gradlew --no-daemon -q assembleDebug
      - name: Enable KVM
        if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Connect on an emulator
        if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash build/android/selftest.sh
      # Android 8 to 11 forbid apps some system calls (a forbidden one
      # used to kill the app as soon as it started a core).
      - name: Connect on an Android 11 emulator
        if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash build/android/selftest.sh
      # The oldest Android the app supports.
      - name: Connect on an Android 6 emulator
        if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 23
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash build/android/selftest.sh

  installer:
    needs: build
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Albatross-folder
          path: dist/Albatross
      - name: Smoke test on Windows
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "albatross-data"
          $out = Join-Path $env:RUNNER_TEMP "albatross-out.txt"
          $p = Start-Process -FilePath "dist\Albatross\Albatross.exe" -ArgumentList "--headless","--ui-port","18080","--data",$data -RedirectStandardOutput $out -PassThru
          $url = $null
          for ($i = 0; $i -lt 30 -and -not $url; $i++) { Start-Sleep 1; $url = Get-Content $out -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $url) { throw "the app did not start" }
          $token = $url.Split("#")[1]
          $h = @{ "X-Token" = $token }
          $state = Invoke-RestMethod -Uri "http://127.0.0.1:18080/api/state" -Headers $h
          # The page is not told about cores; check the files and that the engine answers.
          foreach ($c in "sing-box", "xray", "warp-plus") { if (-not (Test-Path "dist\Albatross\core\$c.exe")) { throw "$c is missing" } }
          if (-not $state.status) { throw "the engine did not answer" }
          if ($state.PSObject.Properties.Name -contains "cores") { throw "the state still lists cores" }
          $page = Invoke-WebRequest -Uri "http://127.0.0.1:18080/" -UseBasicParsing
          if ($page.StatusCode -ne 200) { throw "UI not served" }
          & dist\Albatross\core\sing-box.exe version
          & dist\Albatross\core\xray.exe version
          Stop-Process -Id $p.Id -Force
      - name: Release asks users to sign in
        if: inputs.release != '' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "albatross-acct"
          $out = Join-Path $env:RUNNER_TEMP "albatross-acct.txt"
          $p = Start-Process -FilePath "dist\Albatross\Albatross.exe" -ArgumentList "--headless","--ui-port","18082","--data",$data -RedirectStandardOutput $out -PassThru
          $url = $null
          for ($i = 0; $i -lt 30 -and -not $url; $i++) { Start-Sleep 1; $url = Get-Content $out -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $h = @{ "X-Token" = $url.Split("#")[1] }
          $s = Invoke-RestMethod -Uri "http://127.0.0.1:18082/api/state" -Headers $h
          Stop-Process -Id $p.Id -Force
          if (-not $s.account.enabled) { throw "this release lets people connect without an account" }
          "sign-in is required"
      - name: Real-world connection test
        if: inputs.release == '' && !startsWith(github.ref, 'refs/tags/v')
        # Public free servers change by the minute; report but never block.
        continue-on-error: true
        timeout-minutes: 12
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "albatross-real"
          $out = Join-Path $env:RUNNER_TEMP "albatross-real.txt"
          $p = Start-Process -FilePath "dist\Albatross\Albatross.exe" -ArgumentList "--headless","--ui-port","18081","--data",$data -RedirectStandardOutput $out -PassThru
          $url = $null
          for ($i = 0; $i -lt 30 -and -not $url; $i++) { Start-Sleep 1; $url = Get-Content $out -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $h = @{ "X-Token" = $url.Split("#")[1] }
          $api = "http://127.0.0.1:18081/api"
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 5
            $s = Invoke-RestMethod -Uri "$api/state" -Headers $h
            "t=$($i*5)s servers=$($s.servers) countries=$(@($s.countries | Where-Object { $_.servers -gt 0 }).Count)"
            if ($s.servers -ge 3) { break }
          }
          Invoke-RestMethod -Method Post -Uri "$api/connect" -Headers $h -ContentType "application/json" -Body '{"country":""}' | Out-Null
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep 3
            $s = Invoke-RestMethod -Uri "$api/state" -Headers $h
            "status=$($s.status) $($s.message)"
            if ($s.status -eq "connected") { break }
          }
          if ($s.status -eq "connected") {
            "connected, exit $($s.conn.country), $($s.conn.delay) ms"
            curl.exe -s -x http://127.0.0.1:10808 https://www.cloudflare.com/cdn-cgi/trace
          }
          $s.countries | Where-Object { $_.servers -gt 0 } | Select-Object -First 20 code, servers, best_delay | Format-Table | Out-String
          Invoke-RestMethod -Method Post -Uri "$api/disconnect" -Headers $h | Out-Null
          Stop-Process -Id $p.Id -Force
          if ($s.status -ne "connected") { throw "did not connect" }
      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "build\windows\MicrosoftEdgeWebview2Setup.exe"
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$pwd\dist\Albatross" "/DOutputDir=$pwd\dist" "build\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist\*.exe
      - name: Test installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Albatross-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "albatross-installed"
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=`"$dir`"" -Wait
          foreach ($f in "Albatross.exe","core\sing-box.exe","core\xray.exe","core\warp-plus.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f after install" }
          }
          "installed OK: $dir"
      - uses: actions/upload-artifact@v4
        with:
          name: Albatross-Setup-${{ env.VERSION }}
          path: dist/Albatross-Setup-*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/Albatross-Setup-*.exe
          generate_release_notes: true

  # The installer job creates the release; this adds the APK to it, so two
  # jobs never race to create it.
  release-assets:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [build, installer, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Albatross-android-${{ needs.build.outputs.version }}
          path: dist
      # One download per platform: the Windows installer (added by the
      # installer job) and one Android APK for every phone.
      - name: Name the APK
        run: mv dist/*-android.apk "Albatross-${{ needs.build.outputs.version }}-android.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          # 0.3.1 and earlier were signed with a throwaway key; Android
          # installs the first build signed with the release key only after
          # the old app is removed.
          body: |
            Android: one APK for every phone, Android 6 and newer, 64 and 32-bit. If you have 0.3.1 or older, uninstall it before installing this version (one time only). Later updates install over it.
          files: Albatross-*-android.apk
      - uses: actions/checkout@v4
        with:
          ref: main
          path: repo
      # Installed copies learn of the new version from update.json, with
      # each platform's installer and SHA-256 so they update in place.
      - name: Tell installed copies
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          FORCE: ${{ github.event_name != 'workflow_dispatch' || inputs.force_update }}
          MESSAGE: ${{ inputs.update_message }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > rel.json
          python3 - <<'PY'
          import json, os
          v = os.environ["VERSION"]
          rel = json.load(open("rel.json"))
          # The one APK serves every ABI; 0.3.3 and earlier read only the
          # arm64-v8a entry.
          keys = {"-android.apk": ["android-arm64-v8a", "android-armeabi-v7a"], "Setup-": ["windows"]}
          files = {}
          for a in rel["assets"]:
              for part, names in keys.items():
                  if part in a["name"] and (a.get("digest") or "").startswith("sha256:"):
                      for key in names:
                          files[key] = {"urls": [a["browser_download_url"]], "sha256": a["digest"][7:]}
          path = "repo/update.json"
          m = json.load(open(path))
          m["latest_version"] = v
          # 0.3.3 and later download the new version through their own
          # connection before they stop (require). Older versions read only
          # min_version: they stop at once and open download_url, so the
          # message tells them, in one paragraph (they show it as plain
          # text), how to reinstall.
          apk = files.get("android-arm64-v8a", {}).get("urls", [""])[0]
          page = "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/releases/latest"
          if os.environ["FORCE"] == "true":
              m["require"] = v
              m["min_version"] = v
              if apk:
                  m["download_url"] = apk
          if os.environ.get("MESSAGE"):
              m["message"] = os.environ["MESSAGE"]
          elif os.environ["FORCE"] == "true":
              m["message"] = (
                  f"Albatross {v} is required and this version no longer connects. "
                  "If the app does not update by itself: 1) Uninstall Albatross. "
                  f"2) Download the new version with Get the update, or open {apk or page} in your browser "
                  f"(Windows: Albatross-Setup-{v}.exe from {page}). "
                  "3) Install it and sign in with the username and password you were given. "
                  "Later updates install from inside the app.")
          m["files"] = files
          with open(path, "w") as f:
              json.dump(m, f, indent=2)
              f.write("\n")
          print(json.dumps(m, indent=2))
          PY
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Tell installed copies about $VERSION" && git push origin HEAD:main
          echo "- Released v$VERSION; update.json points at it (forced: $FORCE)." >> "$GITHUB_STEP_SUMMARY"
