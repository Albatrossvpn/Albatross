name: Commit identities

# Every commit must carry a noreply address and UTC times. The repository is
# public: a personal address would identify whoever made the commit, and a
# time zone tells where they live. The log names the commit only, never the
# address.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  noreply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check author and committer addresses and time zones
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch -q origin "$BASE" 2>/dev/null || true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range=("$BASE..$HEAD")
          else
            # History replaced by a forced push: check what no other branch has.
            mapfile -t others < <(git for-each-ref --format='%(refname)' refs/remotes/origin | grep -v '/main$')
            range=("$HEAD" --not "${others[@]}")
          fi
          bad="$(git log --date=format:%z --format='%h %ae %ce %ad %cd' "${range[@]}" | awk '{
            for (i = 2; i <= 3; i++)
              if ($i !~ /@users\.noreply\.github\.com$/ && $i != "noreply@github.com" && $i != "noreply@anthropic.com")
                print $1 " the " (i == 2 ? "author" : "committer") " address is not a noreply address."
            for (i = 4; i <= 5; i++)
              if ($i != "+0000")
                print $1 " the " (i == 4 ? "author" : "committer") " time is not in UTC (commit with TZ=UTC)."
          }')"
          if [ -n "$bad" ]; then
            while read -r sha what; do echo "::error::Commit $sha: $what"; done <<< "$bad"
            exit 1
          fi
          echo "Every new commit uses a noreply address and UTC times."
