name: Hot servers

# Between full collections, re-test the servers the apps try first, so
# hot.txt never lists servers that stopped working an hour ago.
on:
  # Every six hours: a private repository has 2,000 free Actions minutes a
  # month, and one run takes about four.
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hot
  cancel-in-progress: false

jobs:
  hot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v4
        with:
          ref: servers
          path: published
      - name: Cores
        env:
          SINGBOX_VERSION: "1.14.4"
          XRAY_VERSION: "26.10.21"
        run: |
          mkdir -p /tmp/cores && cd /tmp/cores
          curl -fsSL --retry 4 -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar xzf sb.tgz --strip-components=1
          curl -fsSL --retry 4 -o x.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -o x.zip xray
      - name: Test
        env:
          SING_BOX: /tmp/cores/sing-box
          XRAY: /tmp/cores/xray
        run: |
          cat published/hot.txt published/fresh.txt 2>/dev/null | head -n 4000 > "$RUNNER_TEMP/try.txt"
          go run ./cmd/collect -hot-from "$RUNNER_TEMP/try.txt" -real 1500 -out published
      - name: Publish
        working-directory: published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hot.txt
          git diff --cached --quiet && exit 0
          git commit -qm "Hot servers $(date -u +%Y-%m-%dT%H:%MZ)"
          # A full collection may have replaced the branch meanwhile: put
          # this hot.txt on top of the new one.
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          cp hot.txt "$RUNNER_TEMP/hot.txt"
          for try in 1 2 3; do
            git push -q "$url" HEAD:servers && exit 0
            git fetch -q "$url" servers && git reset -q --hard FETCH_HEAD
            cp "$RUNNER_TEMP/hot.txt" hot.txt
            git add hot.txt
            git diff --cached --quiet && exit 0
            git commit -qm "Hot servers $(date -u +%Y-%m-%dT%H:%MZ)"
          done
          exit 1
      # wrangler, to put the files straight into the project's own storage
      # (deploy/files/lib.sh).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Publish to the project's own storage
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash deploy/files/publish-lists.sh "$(bash build/account-url.sh | cut -d, -f1)" servers published/hot.txt
