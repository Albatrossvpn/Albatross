name: Hot servers

# Between full collections, re-test the servers the apps try first, so
# hot.txt never lists servers that stopped working an hour ago.
on:
  # Every six hours: a private repository has 2,000 free Actions minutes a
  # month, and one run takes about four.
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hot
  cancel-in-progress: false

jobs:
  hot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v7
        with:
          ref: servers
          path: published
      # wrangler reads users' reports from the project's own storage and
      # puts the files back there (deploy/files/lib.sh).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Users' reports
        # What users' apps found works on their networks (crowd.json,
        # written hourly by the account service): confirmed servers go
        # first in hot.txt, failing ones are left out.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: backend
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler r2 object get albatross-files/list/servers/crowd.json --file "$RUNNER_TEMP/crowd.json" --remote || echo "::warning::no crowd.json yet"
            npx wrangler r2 object get albatross-files/list/servers/iran.json --file "$RUNNER_TEMP/iran.json" --remote || echo "::warning::no report from a tester inside the country yet (deploy/tester)"
          fi
      - name: Cores
        env:
          SINGBOX_VERSION: "1.14.4"
          XRAY_VERSION: "26.10.21"
        run: |
          mkdir -p /tmp/cores && cd /tmp/cores
          curl -fsSL --retry 4 -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar xzf sb.tgz --strip-components=1
          curl -fsSL --retry 4 -o x.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -o x.zip xray
      - name: Test
        env:
          SING_BOX: /tmp/cores/sing-box
          XRAY: /tmp/cores/xray
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
          # Tags of the project's own probes inside the country (dashboard), comma separated.
          GLOBALPING_TAGS: ${{ vars.GLOBALPING_TAGS }}
        run: |
          cat published/hot.txt published/fresh.txt 2>/dev/null | head -n 4000 > "$RUNNER_TEMP/try.txt"
          go run ./cmd/collect -hot-from "$RUNNER_TEMP/try.txt" -real 1500 -crowd "$RUNNER_TEMP/crowd.json,$RUNNER_TEMP/iran.json" -out published
      - name: Publish
        working-directory: published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hot.txt
          git diff --cached --quiet && exit 0
          git commit -qm "Hot servers $(date -u +%Y-%m-%dT%H:%MZ)"
          # A full collection may have replaced the branch meanwhile: put
          # this hot.txt on top of the new one.
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          cp hot.txt "$RUNNER_TEMP/hot.txt"
          for try in 1 2 3; do
            git push -q "$url" HEAD:servers && exit 0
            git fetch -q "$url" servers && git reset -q --hard FETCH_HEAD
            cp "$RUNNER_TEMP/hot.txt" hot.txt
            git add hot.txt
            git diff --cached --quiet && exit 0
            git commit -qm "Hot servers $(date -u +%Y-%m-%dT%H:%MZ)"
          done
          exit 1
      - name: Publish to the project's own storage
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash deploy/files/publish-lists.sh "$(bash build/account-url.sh | cut -d, -f1)" servers published/hot.txt
