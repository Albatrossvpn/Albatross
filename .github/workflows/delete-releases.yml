name: Delete releases

# Run by hand to remove old releases and their tags, e.g. "v0.2.0 v0.2.1".
# Installed copies keep working; use update.json to make them update.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags to delete, separated by spaces"
        required: true
  # Runs once, doing nothing, when this file changes, so GitHub knows the
  # workflow and it can be started by hand from any branch.
  push:
    paths: [".github/workflows/delete-releases.yml"]

permissions:
  contents: write

jobs:
  delete:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          for t in $TAGS; do
            [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "skipping $t: not a vX.Y.Z tag"; continue; }
            gh release delete "$t" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
            echo "deleted $t"
          done
