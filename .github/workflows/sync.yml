name: Sync

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update
        run: |
          set -euo pipefail
          got=""
          for u in https://accounts.albatrossvpn.online/list/main/update.json https://albatrossvpn.online/list/main/update.json; do
            if curl -fsS --retry 3 --max-time 60 -o new.json "$u"; then got=1; break; fi
          done
          [ -n "$got" ] || { echo "not reachable"; exit 0; }
          # Only a whole, signed manifest; the apps check the signature.
          jq -e '.signed and .sig and .latest_version' new.json > /dev/null || { echo "incomplete"; exit 1; }
          if cmp -s new.json update.json; then rm -f new.json; echo "unchanged"; exit 0; fi
          mv new.json update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Update manifest"
          git push -q origin HEAD:main
          echo "updated"
