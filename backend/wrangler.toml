# Account service for the apps and the website (Cloudflare Worker + D1 database).
# Deployment steps are in README.md.
name = "albatross-accounts"
main = "src/index.js"
compatibility_date = "2025-09-01"
# The service answers only on its own domain, never on workers.dev (or its
# preview addresses): that address names the Cloudflare account and ties
# the service to the account's other Workers.
workers_dev = false
preview_urls = false
routes = [{ pattern = "accounts.albatrossvpn.online", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
# Only the API runs code; pages are served as static files.
run_worker_first = ["/api/*"]

# The release files, served at /dl/<tag>/<name> and stored by the
# administrator's call (deploy/files/push.sh).
[[r2_buckets]]
binding = "FILES"
bucket_name = "albatross-files"

# The support chat on the websites (src/support.js): Workers AI answers (its
# free allowance is enough), and each conversation's summary is mailed to the
# administrator's address (the support_notify_to setting) through Email
# Routing, which sends free to an address the account has verified.
[ai]
binding = "AI"

[[send_email]]
name = "EMAIL"

# Users' reports about servers are summed into list/servers/crowd.json
# every hour (when the Telegram bot's webhook is checked too), and the
# Telegram support bot ends the chats that went quiet every minute (both
# scheduled in src/index.js).
[triggers]
crons = ["23 * * * *", "* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "albatross"
# Printed by `npx wrangler d1 create albatross`; paste it here.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Shown on the site and in its footer. Leave a field empty to hide it.
SITE_NAME = "Albatross"
COMPANY_NAME = ""
COMPANY_ADDRESS = ""
CONTACT_EMAIL = ""
SUPPORT_URL = ""
# Cloudflare Turnstile site key for the sign-up form (optional; the secret
# key goes in the TURNSTILE_SECRET secret).
TURNSTILE_SITEKEY = ""
# The edge's name (edge/wrangler.toml), set by the deploy workflow; the
# service hands its links to signed-in users. Empty means no edge.
EDGE_HOST = ""

# Secrets (set with `npx wrangler secret put NAME`, never in this file):
#   TOKEN_SECRET     long random string that signs sessions
#   ADMIN_USER       administrator login name
#   ADMIN_PASSWORD   administrator password
#   TURNSTILE_SECRET optional, with TURNSTILE_SITEKEY
#   EDGE_UUID        the edge's user id (edge/uuid.sh), set by the deploy workflow
