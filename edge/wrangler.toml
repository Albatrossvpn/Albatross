# The edge: a Cloudflare Worker that carries the app's traffic (VLESS over
# WebSocket, TLS at Cloudflare's edge). Deployed by
# .github/workflows/deploy-backend.yml next to the account service, which
# hands the link to signed-in users (GET /api/v1/edge).
name = "albatross-edge"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "edge.albatrossvpn.online", custom_domain = true }]

[vars]
# Where the Worker reaches sites that are themselves behind Cloudflare
# (a Worker cannot open a socket to Cloudflare's own addresses): one or
# more "host" or "host:port" relays, comma separated, tried in order.
# Empty means such sites are not reachable through the edge; the app then
# uses another server for them.
PROXY_IP = ""

# Secrets (set by the deploy workflow, never in this file):
#   EDGE_UUID  the VLESS user id; the account service hands out the same one
